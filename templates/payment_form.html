<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Record Payment - Sanjeevani Smart Clinic</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 550px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #0f766e;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #0f766e;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💳 Record Payment</h1>

    <form method="post" action="/payments/create-form">

        <label for="amount">
            Amount (₹)
        </label>

        <input
            type="number"
            id="amount"
            name="amount"
            min="1"
            step="0.01"
            required
        >

        <label for="payment_method">
            Payment Method
        </label>

        <select
            id="payment_method"
            name="payment_method"
            required
        >
            <option value="">Select Method</option>
            <option value="cash">💵 Cash</option>
            <option value="card">💳 Card</option>
            <option value="upi">📱 UPI</option>
        </select>

        <label for="transaction_reference">
            Transaction / Reference ID
        </label>

        <input
            type="text"
            id="transaction_reference"
            name="transaction_reference"
            maxlength="150"
            placeholder="Optional for cash"
        >

        <button type="submit">
            Save Payment
        </button>

    </form>

    <a
        class="back"
        href="/payments/history-page"
    >
        ← View Payment History
    </a>

</div>

</body>
</html>
